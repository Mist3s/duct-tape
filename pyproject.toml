[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omsreg"
dynamic = ["version"]
description = "«Синяя изолента» — инструменты медицинской статистики: реестры ОМС (DBF), статистика и экономика стационара, смертность, отчёты Excel и HTML, с единым графическим интерфейсом."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ivanov Andrey" }]
keywords = ["dbf", "oms", "омс", "medical-insurance", "registry", "tkinter",
            "medical-statistics", "excel", "xlsx", "healthcare", "reports"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications",
    "Intended Audience :: Healthcare Industry",
    "Natural Language :: Russian",
    "Topic :: Office/Business",
]
dependencies = []  # чистая стандартная библиотека; tkinter поставляется вместе с CPython

[project.optional-dependencies]
# ruff>=0.14: конфиг опирается на preview-правила (E301-E306, PLC0415, C420)
dev = ["pytest>=7", "ruff>=0.14"]
build = ["pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/Mist3s/duct-tape"
Issues = "https://github.com/Mist3s/duct-tape/issues"

[project.scripts]
omsreg = "omsreg.cli:main"
omsreg-gui = "omsreg.gui.app:main"
omsreg-remove-talons = "omsreg.utils.remove_error_talons:main"
omsreg-remove-codes = "omsreg.utils.remove_codes:main"
omsreg-stat = "omsreg.utils.stat_stacionar:main"
omsreg-econ = "omsreg.utils.stat_economics:main"
omsreg-deaths = "omsreg.utils.stat_deaths:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"omsreg.gui" = ["assets/*.png", "assets/*.ico"]
"omsreg.utils._shared" = ["mkb_death_groups.csv"]

[tool.setuptools.dynamic]
version = { attr = "omsreg.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"
preview = true  # без этого недоступны E301–E306

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B",
    "N",        # именование
    "D",        # докстринги (PEP 257)
    "ARG",      # неиспользуемые параметры
    "SIM",      # упрощения
    "RET", "C4", "PERF",
    "PLC0415",  # импорты не на уровне модуля
    "RUF100",   # устаревшие noqa — чтобы точечные заглушки не жили после исправления
    "PTH",      # один способ работы с путями на весь пакет — pathlib
    "C90",      # цикломатическая сложность (порог см. [tool.ruff.lint.mccabe])
    "PLR0912", "PLR0915", "PLR0913",  # ветвлений / инструкций / аргументов
    # PLR2004 (магические значения) НЕ включено: 55 срабатываний, почти все —
    # ширины полей в форматировании отчётов и сравнения в assert'ах тестов.
]
ignore = [
    "E501",     # длинные строки в форматировании отчётов допустимы
    "D401",     # imperative mood — ложные срабатывания на русских докстрингах
    "D203",     # взаимоисключающее с D211; берём D211
    "D213",     # взаимоисключающее с D212; берём D212
    "D105",     # докстринги magic-методов
    "D107",     # __init__ — контракт описан в докстринге класса
    "PERF203",  # try/except в цикле — сознательно: сбой на одном файле не рвёт обход
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# тесты: имена test_* самодокументируемы
"tests/*" = ["D100", "D103"]
# автогенерированный файл данных — стиль правится в tools/build_ksg_catalog.py
"src/omsreg/utils/_shared/ksg_catalog.py" = ["D", "E", "W"]
# диспетчер подкоманд: импорт утилиты отложен намеренно, чтобы CLI не тянул
# tkinter и неиспользуемые утилиты при каждом запуске
"src/omsreg/cli.py" = ["PLC0415"]
# отложенный импорт обходит реальный цикл stat_economics <-> stat_economics_report;
# PLR0913 — run_econ: 6 аргументов (ВРЕМЕННО, см. блок технического долга ниже)
"src/omsreg/utils/stat_economics.py" = ["PLC0415", "PLR0913"]
# модуль-описание интерфейса: датаклассы документированы построчными
# комментариями к полям, докстринг класса дублировал бы их
"src/omsreg/gui/spec.py" = ["D101"]

# --- ВРЕМЕННО, технический долг: снимать по мере разрезания функций ---
# _load_config: сложность 11 (порог 10); _build_tab: 54 инструкции (порог 50)
"src/omsreg/gui/app.py" = ["C901", "PLR0915"]
# build_report: 61 инструкция (порог 50)
"src/omsreg/utils/_shared/stat_deaths_report.py" = ["PLR0915"]

# --- ВРЕМЕННО, технический долг: PLR0913 (аргументов > 5) ---
# Это функции, чьи параметры один в один повторяют флаги CLI и поля настроек GUI:
# сворачивание их в объект-настройки — отдельный рефакторинг, аудит его не требовал.
"src/omsreg/core/backup.py" = ["PLR0913"]                        # pack_and_verify: 7
"src/omsreg/core/xlsx.py" = ["PLR0913"]                          # write_xlsx: 7
"src/omsreg/utils/_shared/removal_common.py" = ["PLR0913"]       # 7 и 6
"src/omsreg/utils/_shared/stat_stacionar_report.py" = ["PLR0913"]  # 7 и 7
"src/omsreg/utils/remove_codes.py" = ["PLR0913"]                 # run_codes: 9
"src/omsreg/utils/remove_error_talons.py" = ["PLR0913"]          # run_talons: 6
"src/omsreg/utils/stat_stacionar.py" = ["PLR0913"]               # run_stat: 6
